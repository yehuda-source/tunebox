name: Build

# Push a tag like v1.2.3 to build and publish a GitHub Release.
# "Run workflow" on the Actions tab builds without publishing (files appear under Artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: tunebox-${{ matrix.target }}
          path: |
            dist/*.AppImage
            dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Release signing key
        # Optional secrets (base64 keystore + password). Without them the APKs are signed with a
        # throwaway debug key and won't install over a previous release.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tunebox.jks"
            echo "TUNEBOX_KEYSTORE=$RUNNER_TEMP/tunebox.jks" >> "$GITHUB_ENV"
            echo "TUNEBOX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; APKs are signed with a debug key."
          fi
      - run: npm run android:release
      - name: Name the APKs
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p apk
          for f in android/app/build/outputs/apk/release/app-*-release.apk; do
            abi="$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$f" "apk/TuneBox-$version-android-$abi.apk"
          done
          ls -la apk
      - uses: actions/upload-artifact@v7
        with:
          name: tunebox-android
          path: apk/*.apk
          if-no-files-found: error

  ios:
    uses: ./.github/workflows/ios.yml

  release:
    needs: [build, android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: tunebox-*
          merge-multiple: true
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Bump the version first."
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Which file do I download?

          | System | File |
          | --- | --- |
          | **Windows** (recommended) | `TuneBox-*-setup.exe`: installer with Start menu entry and uninstaller |
          | Windows, no install | `TuneBox-*-portable.exe`: run it from anywhere |
          | **Linux** | `TuneBox-*-x86_64.AppImage`: make it executable (`chmod +x`) and run it |
          | **Android** (most phones) | `TuneBox-*-android-arm64-v8a.apk` |
          | Android, older 32-bit phones | `TuneBox-*-android-armeabi-v7a.apk` |
          | Android emulator / x86 tablets | `TuneBox-*-android-x86_64.apk` |
          | **iPhone / iPad** | `TuneBox-*-ios-unsigned.ipa`: sign it with Signulous (or another re-signing service), then install |

          yt-dlp and ffmpeg are included, and yt-dlp keeps itself up to date (on Android too).
          On Android, allow installing from your browser or file manager when asked.
          EOF
          ls -la release
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "TuneBox $GITHUB_REF_NAME" \
              --notes-file notes.md \
              --generate-notes \
              --verify-tag
          fi
