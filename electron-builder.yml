appId: com.tunebox.app
productName: TuneBox
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!test/*'
  - '!scripts/*'
  - '!resources/bin/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!vite.preview.config.ts'
  - '!src/renderer/preview.html'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# yt-dlp / ffmpeg / ffprobe for the target OS (fetched by scripts/fetch-binaries.mjs).
# ${os} is "linux" or "win", matching the folder names.
extraResources:
  - from: resources/bin/${os}
    to: bin
npmRebuild: false
win:
  executableName: TuneBox
  # Used by the zip target; nsis and portable set their own names below.
  artifactName: ${productName}-${version}-win-x64.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${productName}-${version}-portable.${ext}
linux:
  executableName: tunebox
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
  maintainer: TuneBox
  category: AudioVideo;Audio;Player
  synopsis: Search, stream and download music from YouTube Music
appImage:
  artifactName: ${productName}-${version}-x86_64.${ext}
publish: null
