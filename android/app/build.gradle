apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// The app version comes from package.json, like the desktop app.
def appVersion = new JsonSlurper().parse(file('../../package.json')).version
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.-')*.toInteger()

// Release signing: a keystore from the environment (CI secrets), so every release has the same
// signature and installs over the previous one. Without it, release builds use the debug key.
def releaseKeystore = System.getenv('TUNEBOX_KEYSTORE')
def releaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

android {
    namespace = "com.tunebox.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tunebox.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // youtubedl-android ships Python/QuickJS/ffmpeg per CPU type (phones: arm, emulator: x86).
        // Debug builds are one APK for all of them; release builds are split (below).
        if (!releaseBuild) ndk { abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a' }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // yt-dlp runs Python and QuickJS as programs, so native libraries must be unpacked on install.
    packaging { jniLibs { useLegacyPackaging = true } }
    // One APK per CPU type: yt-dlp's Python, QuickJS and ffmpeg are large native libraries.
    splits {
        abi {
            enable releaseBuild
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('TUNEBOX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TUNEBOX_KEY_ALIAS') ?: 'tunebox'
                keyPassword System.getenv('TUNEBOX_KEY_PASSWORD') ?: System.getenv('TUNEBOX_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // yt-dlp (+ Python, QuickJS) and ffmpeg for Android.
    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
    // Background playback, lock screen and notification controls.
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-session:1.11.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
